<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instant Quote Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f5f8;color:#111827}
body.embed{background:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
#bar{background:#0f172a;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px;position:sticky;top:0;z-index:10}
#bar .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge-demo{background:#f59e0b;color:#0f172a;font-weight:800;font-size:11px;padding:3px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
#bar .actions{display:flex;gap:8px;flex-wrap:wrap}
#bar button{border:0;border-radius:6px;padding:8px 12px;font-weight:700;font-size:13px;transition:opacity .15s}
#bar button:hover{opacity:.92}
#bar button:disabled{opacity:.65;cursor:wait}
.btn-edit{background:#fff;color:#0f172a}
.btn-buy{background:#10b981;color:#fff}
main{max-width:540px;margin:20px auto;padding:0 14px 40px}
body.embed main{margin:0 auto;padding:2px 2px 6px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px -5px rgba(0,0,0,.08),0 4px 10px -6px rgba(0,0,0,.04);border:1px solid #e5e7eb}
.card-head{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:24px 22px}
.pill{display:inline-block;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.card-head h1{font-size:26px;margin:0 0 6px;line-height:1.2;overflow-wrap:anywhere}
.card-head p{margin:0;color:#dbeafe;font-size:15px}
.card-body{padding:22px}
.step-label{font-weight:700;font-size:15px;margin:18px 0 10px;color:#111827}
.step-label:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 10px;text-align:center;font-weight:600;font-size:14px;color:#374151;transition:all .15s}
.opt:hover{border-color:#2563eb;color:#1d4ed8}
.opt.on{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;box-shadow:0 0 0 1px #2563eb}
select.field,input.field{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;color:#111827;margin-bottom:10px;font-size:15px}
select.field:focus,input.field:focus{outline:none;border-color:#2563eb}
input.field.err{border-color:#dc2626;margin-bottom:4px}
.err-msg{display:none;color:#b91c1c;font-size:13px;margin:0 0 10px}
.err-msg.show{display:block}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;opacity:0}
.inputs{margin:18px 0 0;padding-top:16px;border-top:1px solid #f3f4f6}
